<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SGRX - Restaurante Catarina</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; margin-top: 100px; }
        .login-box { background: white; padding: 20px; border-radius: 8px; width: 300px; margin: auto; box-shadow: 0px 0px 10px #ccc; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #d4af37; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 95%; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>SGRX - Administração</h2>
        <input type="text" placeholder="Login">
        <input type="password" placeholder="Senha">
        <button>Entrar</button>
    </div>
</body>
</html>
